<!-- ROUND 17 — INSTANT BOOT VEIL: covers the document from first paint so the
     boot overlay (built at end of body) is never beaten to the screen by the dashboard.
     Self-removing: lifts as soon as #bootCenterOverlay exists, max 2.2s failsafe.
     Honors the round-13 skip-today key — if today's greet is dismissed, no veil. -->
<div id="bootVeil" class="boot-veil" aria-hidden="true">
  <div class="boot-veil-core"><svg viewBox="0 0 64 64" fill="none"><path d="M32 6 54 19v26L32 58 10 45V19L32 6z" stroke="#9fe3ff" stroke-width="2.5" stroke-linejoin="round" opacity=".9"/><path d="M32 18 44 25v14l-12 7-12-7V25l12-7z" stroke="#8fd8ff" stroke-width="2" stroke-linejoin="round" opacity=".55"/><circle cx="32" cy="32" r="4" fill="#9fe3ff"><animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></circle></svg></div>
  <div class="boot-veil-label">INITIALIZING COMMAND DECK</div>
  <div class="boot-veil-bar"><i></i></div>
</div>
<script>
(function(){
  "use strict";
  var v=document.getElementById("bootVeil");
  if(!v)return;
  var drop=function(){if(v.parentNode){v.classList.add("gone");setTimeout(function(){if(v.parentNode)v.parentNode.removeChild(v);},520);}};
  try{
    var d=new Date();
    var today=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(localStorage.getItem("csir_boot_skip_v1")===today){drop();return;} /* skipped today: never veil */
  }catch(e){}
  var seen=false;
  var lift=function(){
    if(seen)return;
    if(!document.getElementById("bootCenterOverlay"))return;
    seen=true;
    drop();
  };
  /* Poll cheaply: overlay is created ~instantly once round-13 parses */
  var iv=setInterval(function(){lift();if(seen)clearInterval(iv);},40);
  setTimeout(function(){clearInterval(iv);drop();},2200); /* absolute failsafe */
})();
</script>
